name: Keep Render backend alive

# Render's free tier spins a service down after 15 minutes with no inbound
# traffic, and the next request pays a ~30-60s cold-start penalty. Pinging
# /health every 10 minutes keeps it under that threshold so it never sleeps.
# Not officially supported by Render — just a standard, widely-used
# workaround — and it eats into the workspace's 750 free instance-hours/month
# (basically the whole month for one always-on service), so this only makes
# sense if this is the only free service being kept warm on the account.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        run: |
          # Retry, because a spun-down service answers the first request with
          # a 503 while it boots. Without this the ping fails exactly when it
          # is doing its job, and emails a failure for waking the service up.
          curl -fsS -o /dev/null -w "status: %{http_code}\n" \
            --retry 5 --retry-delay 15 --retry-all-errors --max-time 120 \
            https://recur-z7q0.onrender.com/health
