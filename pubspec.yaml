name: recur
description: Recur — see every recurring charge hitting your Nigerian bank account, automatically.
publish_to: 'none'
version: 0.1.0+1

environment:
  # Flutter 3.27+ / Dart 3.6+ — the design system uses Color.withValues().
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Lottie, for the one place a motion asset earns its size: the moment before
  # something is destroyed, where a beat of hesitation is the point.
  lottie: ^3.1.2
  google_fonts: ^6.2.1
  http: ^1.2.2
  http_parser: ^4.0.2
  flutter_secure_storage: ^9.2.2
  webview_flutter: ^4.10.0
  image_picker: ^1.1.2
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    # Populate with ./tool/fetch_logos.sh. Release builds render either a
    # bundled logo or the brand's initial — never a network fetch — so this
    # folder is the only thing standing between a user and a real logo.
    - assets/logos/
    - assets/animations/
